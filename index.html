<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Календар Щоденник</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div class="header-info">
        <h1>📅 Календар Завдань</h1>
        <p>Плануй навчання зручно та стильно</p>
      </div>

      <div id="notification-banner" class="banner hidden">
        <span class="bell-icon">🔔</span>
        <div id="notification-text"></div>
      </div>
    </header>

    <main class="main-content">
      <!-- Блок Календаря -->
      <section class="calendar-card">
        <div class="calendar-header">
          <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
          <h2 id="month-year-title">Місяць Рік</h2>
          <button class="nav-btn" onclick="changeMonth(1)">›</button>
        </div>
        
        <div class="weekdays-grid">
          <div>Пн</div><div>Вет</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Нд</div>
        </div>

        <div id="calendar-days" class="days-grid"></div>
      </section>

      <!-- Панель деталей обраного дня -->
      <section class="day-details-card">
        <div class="details-header">
          <h2 id="selected-date-title">Обери день</h2>
          <span id="tomorrow-badge" class="badge hidden">Завтра!</span>
        </div>

        <div id="tasks-list" class="tasks-list">
          <p class="empty-state">Обери день у календарі, щоб переглянути або додати завдання.</p>
        </div>

        <button id="add-task-btn" class="glow-btn hidden" onclick="addNewTaskInput()">
          <span>+</span> Додати предмет
        </button>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
